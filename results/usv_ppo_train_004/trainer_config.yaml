behaviors:
  USV_GlobalRLAgent:  
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 1e-4 
      learning_rate_schedule: linear
      beta: 2e-4
      epsilon: 0.2
      lambd: 0.95

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      activation: relu
      encoding_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.005
        gamma: 0.95

    max_steps: 500000
    summary_freq: 1000
    keep_checkpoints: 5
    checkpoint_interval: 10000
    threaded: true
    time_horizon: 64