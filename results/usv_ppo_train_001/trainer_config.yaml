behaviors:
  USV_GlobalRLAgent:  
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 2e-4 
      learning_rate_schedule: constant
      beta: 3e-4
      epsilon: 0.15
      lambd: 0.97

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      activation: relu
      encoding_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.03
        gamma: 0.99

    max_steps: 80000
    summary_freq: 200
    keep_checkpoints: 5
    checkpoint_interval: 10000
    threaded: true
    time_horizon: 16