behaviors:
  USV_GlobalRLAgent:  
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8196
      learning_rate: 5e-5 
      learning_rate_schedule: linear
      beta: 5e-4
      epsilon: 0.15
      lambd: 0.95

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers:  3
      activation: relu
      encoding_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.003
        gamma: 0.95

    max_steps: 1000000
    summary_freq: 1000
    keep_checkpoints: 5
    checkpoint_interval: 10000
    threaded: true
    time_horizon: 128