behaviors:
  USV_GlobalRLAgent:  
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480 
      learning_rate: 3e-4         
      learning_rate_schedule: linear  
      beta: 5.0e-4                  
      epsilon: 0.2                
      lambd: 0.95

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3               
      activation: relu
      encoding_size: 256

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.03               
        encoding_size: 128
        learning_rate: 3.0e-4

    max_steps: 1000000
    summary_freq: 1000
    keep_checkpoints: 5
    checkpoint_interval: 50000
    threaded: true
    time_horizon: 512