behaviors:
  USV_GlobalRLAgent:  
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480  
      learning_rate: 0.0001
      beta: 0.03
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 512
    summary_freq: 1000